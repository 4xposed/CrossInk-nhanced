[package]
name = "crossink-manga-xtask"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
zip = { version = "8", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }
